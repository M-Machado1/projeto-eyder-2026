<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Meteorológica</title>
    <script type="module" src="/src/main.ts"></script>
</head>

<body class="min-h-screen bg-slate-100 p-4 sm:p-6">

    <main class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-blue-600 mb-2">
            Consulta Meteorológica
        </h1>
        <p class="text-gray-600 mb-6">
            Pesquise uma cidade e veja o tempo agora e nos próximos dias.
        </p>

        <form id="search-form" role="search" novalidate>
            <label for="search-input" class="block font-medium text-gray-700 mb-2">
                Digite o nome da cidade:
            </label>

            <div class="flex flex-wrap gap-2">
                <input
                    type="search"
                    id="search-input"
                    name="q"
                    autocomplete="off"
                    required
                    placeholder="Ex.: Parnaíba"
                    aria-describedby="search-error"
                    class="flex-1 basis-56 min-w-0 border border-gray-400 rounded-lg p-3
                           aria-invalid:border-2 aria-invalid:border-red-700"
                >

                <button
                    type="submit"
                    id="search-button"
                    class="bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700
                           disabled:opacity-60 disabled:cursor-progress"
                >
                    Pesquisar
                </button>
            </div>

            <p id="search-error" hidden class="mt-2 font-semibold text-red-700"></p>
        </form>

        <p id="status" role="status" aria-live="polite" class="mt-4 min-h-6 text-gray-700"></p>

        <section id="choices-section" aria-labelledby="choices-title" hidden>
            <h2 id="choices-title" class="text-xl font-semibold mt-6 mb-3">
                Escolha a localidade
            </h2>
            <ul id="choices" class="space-y-3"></ul>
        </section>

        <section id="weather-section" aria-labelledby="weather-title" hidden>
            <h2 id="weather-title" class="text-xl font-semibold mt-6 mb-3">
                Condições atuais
            </h2>
            <article id="current" class="rounded-lg border border-slate-300 bg-slate-50 p-4"></article>

            <h2 id="forecast-title" class="text-xl font-semibold mt-6 mb-3">
                Próximos dias
            </h2>
            <ul id="forecast" aria-labelledby="forecast-title"
                class="grid gap-3 sm:grid-cols-[repeat(auto-fit,minmax(12rem,1fr))]"></ul>
        </section>

    </main>

</body>
</html>
